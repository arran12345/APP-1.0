<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="The Marlow — four-drawer chest illustration">
  <rect width="800" height="1000" fill="#F8F3E7"/>
  <!-- Top with beaded edge -->
  <rect x="200" y="320" width="400" height="14" fill="#2E2E2E" opacity="0.7"/>
  <rect x="208" y="334" width="384" height="6" fill="#2E2E2E" opacity="0.4"/>
  <!-- Body -->
  <rect x="210" y="340" width="380" height="400" fill="#F2EBDD" stroke="#2E2E2E" stroke-width="1.5" stroke-opacity="0.45"/>
  <!-- 4 drawers -->
  <line x1="210" y1="440" x2="590" y2="440" stroke="#2E2E2E" stroke-width="1" opacity="0.35"/>
  <line x1="210" y1="540" x2="590" y2="540" stroke="#2E2E2E" stroke-width="1" opacity="0.35"/>
  <line x1="210" y1="640" x2="590" y2="640" stroke="#2E2E2E" stroke-width="1" opacity="0.35"/>
  <!-- Porcelain knobs -->
  <circle cx="340" cy="390" r="9" fill="#2E2E2E" opacity="0.55"/>
  <circle cx="460" cy="390" r="9" fill="#2E2E2E" opacity="0.55"/>
  <circle cx="340" cy="490" r="9" fill="#2E2E2E" opacity="0.55"/>
  <circle cx="460" cy="490" r="9" fill="#2E2E2E" opacity="0.55"/>
  <circle cx="340" cy="590" r="9" fill="#2E2E2E" opacity="0.55"/>
  <circle cx="460" cy="590" r="9" fill="#2E2E2E" opacity="0.55"/>
  <circle cx="340" cy="690" r="9" fill="#2E2E2E" opacity="0.55"/>
  <circle cx="460" cy="690" r="9" fill="#2E2E2E" opacity="0.55"/>
  <!-- Bracket feet -->
  <path d="M 210 740 L 210 770 L 230 770 L 240 740 Z" fill="#2E2E2E" opacity="0.7"/>
  <path d="M 590 740 L 590 770 L 570 770 L 560 740 Z" fill="#2E2E2E" opacity="0.7"/>
  <line x1="140" y1="772" x2="660" y2="772" stroke="#2E2E2E" stroke-width="1" opacity="0.18"/>
  <text x="400" y="870" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="42" font-style="italic" fill="#2E2E2E">The Marlow</text>
</svg>
