<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="Two mates, a workshop">
  <rect width="800" height="1000" fill="#F2EBDD"/>
  <!-- workshop bench silhouette -->
  <rect x="80" y="640" width="640" height="24" fill="#2E2E2E" opacity="0.85"/>
  <rect x="120" y="664" width="14" height="180" fill="#2E2E2E" opacity="0.85"/>
  <rect x="666" y="664" width="14" height="180" fill="#2E2E2E" opacity="0.85"/>
  <!-- a sanded plank on the bench -->
  <rect x="180" y="612" width="440" height="28" fill="#6B7A5A"/>
  <!-- hand tools laid out -->
  <rect x="220" y="600" width="80" height="6" fill="#56624A"/>
  <rect x="320" y="600" width="40" height="6" fill="#2B3A4A"/>
  <circle cx="430" cy="603" r="6" fill="#56624A"/>
  <rect x="460" y="598" width="100" height="8" fill="#2E2E2E" opacity="0.7"/>
  <!-- wall: vertical boards -->
  <g opacity="0.07" stroke="#2E2E2E" stroke-width="1">
    <line x1="120" y1="100" x2="120" y2="640"/>
    <line x1="240" y1="100" x2="240" y2="640"/>
    <line x1="360" y1="100" x2="360" y2="640"/>
    <line x1="480" y1="100" x2="480" y2="640"/>
    <line x1="600" y1="100" x2="600" y2="640"/>
    <line x1="720" y1="100" x2="720" y2="640"/>
  </g>
  <!-- shelf -->
  <rect x="150" y="240" width="500" height="6" fill="#2E2E2E" opacity="0.65"/>
  <!-- tins on shelf -->
  <rect x="200" y="200" width="40" height="40" fill="#6B7A5A"/>
  <rect x="260" y="190" width="36" height="50" fill="#2B3A4A"/>
  <rect x="320" y="210" width="44" height="30" fill="#F8F3E7" stroke="#2E2E2E" stroke-width="1" stroke-opacity="0.5"/>
  <rect x="384" y="200" width="38" height="40" fill="#56624A"/>
  <rect x="442" y="208" width="44" height="32" fill="#2E2E2E" opacity="0.65"/>
  <rect x="510" y="195" width="40" height="45" fill="#F2EBDD" stroke="#2E2E2E" stroke-width="1" stroke-opacity="0.5"/>
</svg>
