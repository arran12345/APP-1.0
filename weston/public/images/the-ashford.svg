<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="The Ashford — sideboard illustration">
  <rect width="800" height="1000" fill="#F8F3E7"/>
  <!-- Sideboard body -->
  <rect x="140" y="430" width="520" height="280" fill="#6B7A5A"/>
  <!-- Top -->
  <rect x="130" y="420" width="540" height="18" fill="#2E2E2E" opacity="0.85"/>
  <!-- Doors -->
  <line x1="400" y1="450" x2="400" y2="690" stroke="#56624A" stroke-width="2"/>
  <!-- Handles -->
  <rect x="330" y="560" width="40" height="6" fill="#F2EBDD"/>
  <rect x="430" y="560" width="40" height="6" fill="#F2EBDD"/>
  <!-- Legs -->
  <rect x="160" y="710" width="10" height="50" fill="#2E2E2E" opacity="0.85"/>
  <rect x="630" y="710" width="10" height="50" fill="#2E2E2E" opacity="0.85"/>
  <!-- Floor line -->
  <line x1="80" y1="765" x2="720" y2="765" stroke="#2E2E2E" stroke-width="1" opacity="0.18"/>
  <!-- Piece name -->
  <text x="400" y="870" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="42" font-style="italic" fill="#2E2E2E">The Ashford</text>
</svg>
